<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATNO — lemezbolt, klub, kert · Budapest VII.</title>
<meta name="description" content="ATNO — record shop by day, techno after dark, a garden in between. Kertész utca 33., Budapest VII.">
<meta property="og:title" content="ATNO — Budapest VII.">
<meta property="og:description" content="Lemezbolt, klub, konyha, kert. Egy udvar a hetedik kerületben.">
<meta name="theme-color" content="#0B1008">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1008;
  --acid:#F2FF6B;
  --bone:#EDEADC;
  --bone-dim:rgba(237,234,220,.58);
  --bone-faint:rgba(237,234,220,.14);
  --display:"Syne","Archivo","Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --gut:clamp(20px,4vw,72px);
  /* the gutter has to survive notches, rounded corners and the home bar */
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --gut-l:calc(var(--gut) + var(--safe-l));
  --gut-r:calc(var(--gut) + var(--safe-r));
  --lab:#F2FF6B;
  --d:min(80vw,102vh);        /* the record — 75% bigger than before */
  --cx:29vw;                  /* where its centre sits — crops off the left edge */
  --cy:50%;                   /* and how high it rides */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--bone);
  font-family:var(--mono);font-weight:400;
  font-size:clamp(13px,.42vw + 11.6px,15px);line-height:1.62;
  letter-spacing:.005em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
::selection{background:var(--acid);color:var(--ink)}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--bone-faint)}
a:hover{border-color:var(--lab);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--acid);outline-offset:3px}

/* ───────── room ───────── */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(34px) saturate(.8)}
.field figure{position:absolute;inset:0;margin:0;opacity:0;
  background-position:center;background-size:cover;
  mix-blend-mode:screen;transform:scale(1.07);
  transition:opacity 1.3s ease,transform 1.8s ease}
.field figure.is-on{opacity:.17;transform:scale(1)}
.field figure[data-tone="a"]{filter:saturate(1.15) contrast(1.05)}
.field figure[data-tone="b"]{filter:saturate(.7) hue-rotate(-26deg) contrast(1.12)}
.field figure[data-tone="c"]{filter:saturate(1.3) hue-rotate(14deg) brightness(.92)}
.field figure[data-tone="d"]{filter:saturate(.85) hue-rotate(54deg) contrast(1.04)}
.field figure[data-tone="e"]{filter:saturate(.3) contrast(1.2) brightness(1.02)}

.grain{position:fixed;inset:-50%;z-index:40;pointer-events:none;opacity:.2;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
  mix-blend-mode:soft-light}

/* keeps the words legible where they cross the grooves */
.veil{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(11,16,8,0) 26%,rgba(11,16,8,.22) 44%,
    rgba(11,16,8,.62) 60%,rgba(11,16,8,.84) 78%,rgba(11,16,8,.9) 100%)}

/* ───────── the record, fixed and dominant ───────── */
.deck{position:fixed;inset:0;z-index:2;pointer-events:none}
.pos{position:absolute;left:var(--cx);top:var(--cy);
  width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  perspective:1800px}
.tt{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.22,.7,.3,1)}
.disc{position:absolute;inset:0;border-radius:50%;pointer-events:auto;
  cursor:grab;touch-action:pan-y;
  box-shadow:0 60px 130px -40px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.6);
  transition:transform .46s cubic-bezier(.3,.8,.35,1),opacity .46s ease}
.disc.is-drag{cursor:grabbing}
.disc.is-off{transform:translateY(-9%) scale(.93);opacity:0}
.disc.is-in{transform:translateY(6%) scale(.97);opacity:0;transition:none}

.wax{position:absolute;inset:0;border-radius:50%;overflow:hidden;will-change:transform;
  background:radial-gradient(circle at 50% 50%,#191b14 0 15.5%,#0c0e09 15.6% 100%)}

/* the artwork, pressed into the playing surface */
.pic{position:absolute;inset:0;border-radius:50%;opacity:0;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  transition:opacity 1s ease,transform 1.4s ease;transform:scale(1.05)}
.pic.is-on{opacity:1;transform:scale(1)}

/* grooves ride over the top of it */
.grooves{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.42) 1px 3.2px),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.07) 0 1.5px,rgba(0,0,0,0) 1.5px 30px);
  mix-blend-mode:overlay}
/* sinks the middle and the rim so it still reads as a record */
.shade{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(6,8,4,.88) 0 13%,rgba(6,8,4,.35) 22%,rgba(6,8,4,0) 38%,
      rgba(6,8,4,.22) 74%,rgba(6,8,4,.72) 100%)}
.wax::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from -30deg,
    rgba(255,255,255,.12),rgba(255,255,255,0) 15%,
    rgba(255,255,255,0) 61%,rgba(255,255,255,.055) 73%,rgba(255,255,255,0) 87%);
  mix-blend-mode:screen}

.label{position:absolute;left:50%;top:50%;width:30%;height:30%;
  transform:translate(-50%,-50%);border-radius:50%;display:block}
.label .lb-bg{fill:var(--lab);transition:fill .55s ease}
.label text{font-family:var(--mono);fill:#0B1008;letter-spacing:.15em}
.label .lb-ring{font-size:7.6px}
/* the house mark, traced from the original ink */
.label .lb-mark{fill:var(--ink);transition:fill .55s ease}

.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:
    linear-gradient(118deg,transparent 24%,rgba(255,255,255,.115) 41%,transparent 52%),
    radial-gradient(circle at 28% 22%,rgba(255,255,255,.1),transparent 42%),
    radial-gradient(circle at 76% 84%,rgba(154,160,220,.09),transparent 38%)}
.hole{position:absolute;left:50%;top:50%;width:1.8%;height:1.8%;
  transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}

.arm{position:absolute;top:2%;right:-13%;width:52%;height:14%;
  transform-origin:88% 26%;transform:rotate(-34deg);
  transition:transform .6s cubic-bezier(.3,.8,.35,1);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.65))}
.arm svg{width:100%;height:100%;display:block}

/* ───────── hud ───────── */
.hud{position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:clamp(16px,2.6vh,26px) var(--gut-r) clamp(16px,2.6vh,26px) var(--gut-l);
  pointer-events:none}
.hud > *{pointer-events:auto}
/* the house mark. sized so the thinnest strokes still survive: below ~40px
   tall the tapered ends of the swoosh rasterise away, so the hairline stroke
   below holds them open at any size. */
.mark{display:flex;align-items:center;height:44px;color:var(--lab);
  transition:color .6s ease}
.mark svg{height:100%;width:auto;display:block;overflow:visible}
.mark path{fill:currentColor;stroke:currentColor;stroke-width:.6;
  vector-effect:non-scaling-stroke;paint-order:stroke}

/* ───────── the words ───────── */
.sheets{position:relative;z-index:10}
.sheet{min-height:100svh;display:grid;align-items:center;
  padding:clamp(96px,16vh,150px) var(--gut-r)
          calc(clamp(120px,18vh,170px) + var(--safe-b)) var(--gut-l)}
.sheet > .col{width:min(42ch,44vw);justify-self:end}

.cat{display:flex;align-items:center;gap:11px;margin:0 0 16px;
  font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-dim)}
.cat b{font-weight:500;color:var(--lab);transition:color .55s ease}
.cat s{text-decoration:none;flex:1;height:1px;background:var(--bone-faint)}

.title{font-family:var(--display);font-weight:800;
  font-size:42px;line-height:.98;margin:0 0 18px;
  letter-spacing:-.008em;text-transform:uppercase;
  text-wrap:balance}
.strap{margin:0 0 30px;color:var(--bone-dim);max-width:30ch;line-height:1.66;
  text-wrap:pretty}

.cuts{list-style:none;margin:0 0 26px;padding:0}
.cut{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;
  align-items:baseline;
  padding:9px 0;border-top:1px solid rgba(237,234,220,.09);
  transition:border-color .3s ease}
.cut:last-child{border-bottom:1px solid rgba(237,234,220,.09)}
.cut i{font-style:normal;font-size:10px;letter-spacing:.12em;
  color:var(--bone-dim);transition:color .28s ease;white-space:nowrap}
.cut b{font-weight:400;font-size:clamp(13px,.9vw,15px);
  min-width:0;overflow-wrap:break-word;text-wrap:pretty}
.cut u{text-decoration:none;font-size:10.5px;color:var(--bone-dim);
  white-space:nowrap;text-align:right;transition:color .28s ease}

/* every row was measuring its own columns, so the names started at a
   different x on each line. one shared set of rails fixes all of them. */
@supports (grid-template-columns:subgrid){
  .cuts{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;row-gap:0}
  .cut{grid-column:1/-1;grid-template-columns:subgrid}
}
.cut:hover{border-color:rgba(237,234,220,.26)}
.cut:hover i,.cut:hover u{color:var(--lab)}
.cut:hover b{color:#fff}

.meta{margin:0;font-size:10.5px;letter-spacing:.16em;line-height:1.5;
  text-transform:uppercase;color:var(--bone-dim);text-wrap:pretty}

/* ───────── crate ───────── */
.crate{position:fixed;left:var(--gut-l);
  bottom:calc(clamp(18px,3.4vh,32px) + var(--safe-b));z-index:30;
  display:flex;align-items:flex-end;gap:7px}
.rec{position:relative;width:clamp(28px,3.6vw,40px);height:clamp(42px,5.8vh,58px);
  border-radius:2px 2px 3px 3px;background:linear-gradient(180deg,#1b1e15,#0d110a);
  border:1px solid rgba(237,234,220,.11);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
  transition:transform .34s cubic-bezier(.2,.8,.3,1),border-color .34s,background .34s}
.rec::before{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);
  width:64%;height:10px;border-radius:50%;background:var(--c);opacity:.5;
  transition:opacity .34s ease,transform .34s ease}
.rec span{font-size:9px;letter-spacing:.08em;color:var(--bone-dim);transition:color .34s}
.rec:hover{transform:translateY(-7px);border-color:rgba(237,234,220,.3)}
.rec:hover::before{opacity:.85}
.rec[aria-current="true"]{transform:translateY(-13px);
  border-color:rgba(237,234,220,.42);background:linear-gradient(180deg,#262b1d,#12160d)}
.rec[aria-current="true"]::before{opacity:1;transform:translateX(-50%) translateY(-2px)}
.rec[aria-current="true"] span{color:var(--bone)}

.hint{position:fixed;right:var(--gut-r);
  bottom:calc(clamp(20px,3.6vh,34px) + var(--safe-b));z-index:30;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);
  display:flex;align-items:center;gap:9px;transition:opacity .7s ease}
.hint.is-gone{opacity:0}
.hint em{font-style:normal;width:18px;height:1px;background:var(--bone-faint)}

/* ───────── on air ───────── */
.live{--hot:#FF4D3D;display:inline-flex;align-items:center;gap:10px;
  padding:8px 15px 8px 12px;border:1px solid var(--bone-faint);border-radius:999px;
  background:rgba(11,16,8,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);
  transition:border-color .35s,background .35s,color .35s}
.live:hover{border-color:rgba(242,255,107,.5);background:rgba(11,16,8,.76);color:var(--bone)}
.live.is-on{color:var(--bone);border-color:rgba(255,77,61,.34)}
.live[disabled]{opacity:.4;pointer-events:none}
.live__dot{width:7px;height:7px;border-radius:50%;background:var(--hot);flex:none;
  opacity:.4;transition:opacity .35s}
.live.is-on .live__dot{opacity:1;animation:onair 1.9s ease-out infinite}
@keyframes onair{0%{box-shadow:0 0 0 0 rgba(255,77,61,.5)}
  70%{box-shadow:0 0 0 11px rgba(255,77,61,0)}100%{box-shadow:0 0 0 0 rgba(255,77,61,0)}}
.live__tag{letter-spacing:.2em;transition:color .35s}
.live.is-on .live__tag{color:var(--hot)}
.live__eq{display:flex;align-items:flex-end;gap:2px;height:11px;width:15px;flex:none}
.live__eq i{display:block;width:3px;height:3px;background:var(--acid);opacity:.3;
  transition:opacity .35s}
.live.is-on .live__eq i{opacity:1;animation:eq .9s ease-in-out infinite}
.live.is-on .live__eq i:nth-child(2){animation-duration:.62s;animation-delay:-.22s}
.live.is-on .live__eq i:nth-child(3){animation-duration:1.15s;animation-delay:-.5s}
.live.is-on .live__eq i:nth-child(4){animation-duration:.74s;animation-delay:-.36s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
.sc-hide{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.001;
  pointer-events:none;z-index:-1;border:0;overflow:hidden}
.sc-hide iframe{width:100%;height:100%;border:0}

/* ───────── narrow ───────── */
@media (max-width:1000px){
  /* the record rides high and crops off the top edge, so the label never
     sits under the words. everything below it gets sealed by the veil. */
  :root{--d:min(148vw,74vh);--cx:50vw;--cy:26vh}
  .veil{background:linear-gradient(180deg,
    rgba(11,16,8,.22) 0%,rgba(11,16,8,.10) 10%,
    rgba(11,16,8,.55) 22%,rgba(11,16,8,.86) 32%,
    rgba(11,16,8,.94) 45%,rgba(11,16,8,.97) 100%)}
  .sheet{align-items:end;padding:clamp(80px,14vh,120px) var(--gut-r)
         calc(clamp(120px,17vh,160px) + var(--safe-b)) var(--gut-l)}
  .sheet > .col{width:100%;justify-self:stretch}
  .strap{max-width:none;margin-bottom:24px}
  .arm{right:-4%;width:46%}
  .crate{left:50%;transform:translateX(-50%)}
  .mark{height:34px}
  .hint{display:none}
  .live__tag{display:none}
}

/* ───────── phone ───────── */
@media (max-width:560px){
  .cat{margin-bottom:14px;font-size:10px;letter-spacing:.2em;gap:9px}
  .strap{margin-bottom:22px}

  /* three across is too tight to read here. the code goes above the name,
     the price keeps its own rail and sits on the name's baseline. */
  .cuts{display:block;margin-bottom:22px}
  .cut{grid-column:auto;grid-template-columns:1fr auto;
    column-gap:14px;row-gap:3px;padding:11px 0}
  .cut i{grid-column:1;grid-row:1;font-size:9.5px}
  .cut b{grid-column:1;grid-row:2}
  .cut u{grid-column:2;grid-row:2}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

    <span class="live__eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
</div>

<main class="sheets" id="sheets"></main>

<nav class="crate" id="crate" aria-label="Lemezek"></nav>
<div class="hint" id="hint"><em></em> Görgess — forog</div>

<div class="sc-hide"><iframe id="scPlayer" title="ATNO Radio" allow="autoplay"
     scrolling="no" frameborder="no" src="about:blank"></iframe></div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   THE CRATE — one object per record. Add one and a new spine,
   a new sheet and a new scroll section all appear by themselves.
   cuts: [ left, main, right ]  — keep it to five or six lines.
   pic  : the picture pressed into this record. Point it at your own
          file — pic:'images/kert.jpg' — or leave it '' to use the
          plate that shipped with the page.
   ══════════════════════════════════════════════════════════════ */
const CRATE = [
  {
    no:'001', pic:'', code:'ATN 001', side:'JÚLIUS 2026', colour:'#F2FF6B',
    title:'Július', meta:'Szerda — vasárnap · 19:00 → 06:00',
    strap:'Két terem és a kert. A pince a hangosabb végének.',
    cuts:[
      ['07—04','Supra','house, techno'],
      ['07—11','143','experimental'],
      ['07—17','Teknoázis','freetek, acid'],
      ['07—25','Kéz- és lábtörtést','breakcore'],
      ['07—31','4tune','hardcore, trance']
    ]
  },
  {
    no:'002', pic:'', code:'ATN 002', side:'A BOLT · SIDE B', colour:'#9AA0DC',
    title:'A bolt', meta:'Kedd — szombat 12:00–20:00',
    strap:'Minden lejátszó működik. Mutass rá egy borítóra, feltesszük.',
    cuts:[
      ['ATN 001','ATNO Sound System — Kertész EP','5 500 Ft'],
      ['KTL 004','Kósa Trió — Éjfél után','6 900 Ft'],
      ['SH 2210','Various — Duna Loops Vol. 2','8 200 Ft'],
      ['USED','7" doboz, válogatatlan','900 Ft']
    ]
  },
  {
    no:'003', pic:'', code:'ATN 003', side:'KONYHA · SIDE B', colour:'#E4633A',
    title:'Konyha', meta:'12:00–23:00 · újranyit hajnali háromkor',
    strap:'Egy szakács, egy fritőz, rövid lap. Változik a piaccal.',
    cuts:[
      ['01','Lángos — fokhagyma, tejföl, sajt','1 900 Ft'],
      ['03','Bableves, füstölt csülök','2 600 Ft'],
      ['04','Rakott krumpli, kettőnek','3 900 Ft'],
      ['03:00','Éjszakai leves + vajas pogácsa','1 500 Ft']
    ]
  },
  {
    no:'004', pic:'', code:'ATN 004', side:'A KERT · SIDE B', colour:'#7FA34B',
    title:'A kert', meta:'Naponta 12:00–24:00 · éjfélkor csend',
    strap:'Egy diófa, nyolcvan össze nem illő szék, egy fal, amire vetítünk.',
    cuts:[
      ['Vasárnap','Lemezvásár','ingyenes'],
      ['Szombat','Lassú brunch','à la carte'],
      ['Vasárnap','Mozi a hátsó falon','2 000 Ft']
    ]
  },
  {
    no:'005', pic:'', code:'ATN 005', side:'IDE GYERE · RUN-OUT', colour:'#EDEADC',
    title:'Ide gyere', meta:'A sárga csengő, a kapu mögött',
    strap:'Be a kapun, át az udvaron. Ha zártnak tűnik, valószínűleg nyitva van.',
    cuts:[
      ['Cím','Kertész utca 33.','Budapest VII.'],
      ['Villamos','4–6 Wesselényi utca','M2 Blaha'],
      ['Írj','hello@atno.hu','+36 30 123 4567'],
      ['Insta','@atno.budapest','']
    ]
  }
];
</script>
<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const disc = document.getElementById('disc');
  const wax  = document.getElementById('wax');
  const tt   = document.getElementById('tt');
  const arm  = document.getElementById('arm');
  const crate= document.getElementById('crate');
  const hint = document.getElementById('hint');
  const lbSide = document.getElementById('lbSide');
  const sheets = document.getElementById('sheets');
  const arts = [...document.querySelectorAll('.field figure')];
  const root = document.documentElement;

  const PARK = -34, LEAD = -13, RUNOUT = 4;
  const BASE = reduce ? 0 : .32;

  let idx = -1, want = 0, angle = 0, vel = BASE;
  let dragging = false, prevRaw = 0, busy = false;
  let armWant = PARK, armNow = PARK;

  /* ── sheets + crate, both from CRATE ── */
  sheets.innerHTML = CRATE.map((r,i) =>
    '<section class="sheet" data-i="' + i + '" id="rec' + i + '"><div class="col">' +
      '<p class="cat"><b>' + r.code + '</b><s></s><span>33⅓ RPM</span></p>' +
      '<h2 class="title">' + r.title + '</h2>' +
      '<p class="strap">' + r.strap + '</p>' +
      '<ul class="cuts">' + r.cuts.map((c,n) =>
        '<li class="cut" data-n="' + n + '"><i>' + c[0] + '</i>' +
        '<b>' + c[1] + '</b><u>' + (c[2] || '') + '</u></li>').join('') +
      '</ul>' +
      '<p class="meta">' + r.meta + '</p>' +
    '</div></section>').join('');

  CRATE.forEach((r,i) => {
    const b = document.createElement('button');
    b.className = 'rec'; b.type = 'button';
    b.style.setProperty('--c', r.colour);
    b.setAttribute('aria-label', r.code + ' — ' + r.title);
    b.innerHTML = '<span>' + r.no + '</span>';
    b.addEventListener('click', () => {
      document.getElementById('rec' + i)
        .scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
    });
    crate.appendChild(b);
  });
  const spines = [...crate.children];

  /* hovering a line walks the needle to that groove */
  sheets.querySelectorAll('.cuts').forEach(list => {
    const cuts = [...list.children];
    cuts.forEach(li => li.addEventListener('mouseenter', () => {
      const t = cuts.length > 1 ? +li.dataset.n / (cuts.length - 1) : 0;
      armWant = LEAD + (RUNOUT - LEAD) * t;
    }));
    list.addEventListener('mouseleave', () => { armWant = LEAD; });
  });

  /* ── the artwork that goes on each record ── */
  const PLATES = [...document.querySelectorAll('.field figure')].map(f => f.style.backgroundImage);
  const pics = document.getElementById('pics');
  pics.innerHTML = CRATE.map((r,i) => '<div class="pic" data-rec="' + i + '"></div>').join('');
  const picEls = [...pics.children];
  picEls.forEach((el,i) => {
    el.style.backgroundImage = CRATE[i].pic
      ? "url('" + CRATE[i].pic + "')"
      : (PLATES[i] || PLATES[i % PLATES.length]);
    el.style.filter = ['saturate(1.05) contrast(1.04)',
                       'saturate(.72) hue-rotate(-26deg) contrast(1.1)',
                       'saturate(1.25) hue-rotate(14deg) brightness(.94)',
                       'saturate(.85) hue-rotate(54deg) contrast(1.04)',
                       'saturate(.32) contrast(1.18)'][i % 5];
  });

  /* ── put a record on ── */
  function paint(i){
    const r = CRATE[i];
    picEls.forEach((el,n) => el.classList.toggle('is-on', n === i));
    root.style.setProperty('--lab', r.colour);
    lbSide.textContent = r.code + ' · ' + r.side;
    disc.setAttribute('aria-valuenow', i + 1);
    arts.forEach(f => f.classList.toggle('is-on', +f.dataset.rec === i));
    spines.forEach((s,n) => s.setAttribute('aria-current', n === i ? 'true' : 'false'));
  }
  function load(i){
    want = i;
    if (busy || i === idx) return;
    idx = i;
    if (reduce){ paint(i); armWant = LEAD; return; }
    busy = true;
    armWant = PARK;
    disc.classList.add('is-off');
    setTimeout(() => {
      paint(i);
      disc.classList.remove('is-off');
      disc.classList.add('is-in');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        disc.classList.remove('is-in');
        armWant = LEAD;
        busy = false;
        if (want !== idx) load(want);   /* caught up after fast scrolling */
      }));
    }, 440);
  }

  /* ── which sheet are we on ── */
  const obs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) load(+e.target.dataset.i); });
  }, {rootMargin:'-45% 0px -45% 0px', threshold:0});
  document.querySelectorAll('.sheet').forEach(s => obs.observe(s));

  /* ── scrolling turns it ── */
  let lastY = scrollY;
  addEventListener('scroll', () => {
    const y = scrollY;
    vel += (y - lastY) * .05;
    lastY = y;
    if (y > 40) hint.classList.add('is-gone');
  }, {passive:true});

  /* ── and so does your hand ── */
  const raw = e => {
    const b = disc.getBoundingClientRect();
    return Math.atan2(e.clientY - (b.top + b.height/2),
                      e.clientX - (b.left + b.width/2)) * 180 / Math.PI;
  };
  const norm = d => ((d + 180) % 360 + 360) % 360 - 180;

  disc.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;      /* let touch scroll the page */
    dragging = true; vel = 0; prevRaw = raw(e);
    disc.classList.add('is-drag');
    disc.setPointerCapture(e.pointerId);
    hint.classList.add('is-gone');
  });
  disc.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = raw(e), d = norm(now - prevRaw);
    prevRaw = now; angle += d; vel = vel * .55 + d * .45;
  });
  const drop = e => {
    if (!dragging) return;
    dragging = false; disc.classList.remove('is-drag');
    try { disc.releasePointerCapture(e.pointerId); } catch(_){}
  };
  disc.addEventListener('pointerup', drop);
  disc.addEventListener('pointercancel', drop);

  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ jump(1); }
    else if (e.key === 'ArrowLeft'){ jump(-1); }
    else if (/^[1-5]$/.test(e.key)){ hop(+e.key - 1); }
    else return;
    e.preventDefault();
  });
  const hop = i => document.getElementById('rec' + i)
    .scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
  const jump = d => hop(Math.max(0, Math.min(CRATE.length - 1, idx + d)));

  /* ── tilt ── */
  if (!reduce && matchMedia('(hover:hover)').matches){
    addEventListener('pointermove', e => {
      if (dragging) return;
      const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      tt.style.transform = 'rotateX(' + (-y*5).toFixed(2) + 'deg) rotateY(' + (x*5).toFixed(2) + 'deg)';
    }, {passive:true});
  }

  /* ── loop ── */
  function frame(){
    if (!dragging){ vel += (BASE - vel) * .05; angle += vel; }
    wax.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
    const fast = Math.abs(vel);
    wax.style.filter = (!reduce && fast > 8)
      ? 'blur(' + Math.min(2, (fast - 8) * .05).toFixed(2) + 'px)' : '';
    armNow += (armWant - armNow) * .07;
    arm.style.transform = 'rotate(' + armNow.toFixed(2) + 'deg)';
    requestAnimationFrame(frame);
  }

  load(0);
  requestAnimationFrame(frame);

  /* ══════════════════════════════════════════════════════════════
     ATNO RADIO — SC_EMBED wins if both are filled.
     SC_EMBED : SoundCloud → Share → Embed → paste the code here.
     SC_URL   : the plain page link. on.soundcloud.com shortlinks
                do NOT work — open one and copy the real address.
     ══════════════════════════════════════════════════════════════ */
  const SC_EMBED = "";
  const SC_URL   = "https://soundcloud.com/atno-budapest/sets/atno-radio";
  const VOLUME   = 55;
  const LOOP     = true;

  const frameEl = document.getElementById('scPlayer');
  const btn = document.getElementById('live');
  if (!frameEl || !btn || !window.SC) return;

  const OPTS = '&auto_play=true&hide_related=true&show_comments=false' +
               '&show_user=false&show_teaser=false&sharing=false' +
               '&buying=false&download=false&visual=false';
  let src;
  if (SC_EMBED.trim()){
    const m = SC_EMBED.match(/src\s*=\s*["']([^"']+)["']/i);
    let r = (m ? m[1] : SC_EMBED.trim()).replace(/&amp;/g,'&');
    r = r.split('&auto_play')[0].split('&visual')[0];
    src = r + (r.indexOf('?') > -1 ? '' : '?') + OPTS;
  } else {
    if (/on\.soundcloud\.com/i.test(SC_URL))
      console.warn('ATNO radio: on.soundcloud.com shortlinks cannot be embedded. ' +
        'Use the full soundcloud.com address, or paste Share → Embed into SC_EMBED.');
    src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(SC_URL) + OPTS;
  }
  frameEl.src = src;

  const widget = SC.Widget(frameEl);
  let playing = false, dead = false, fader = null;

  function render(){
    btn.classList.toggle('is-on', playing);
    btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    if (dead){ btn.setAttribute('disabled',''); btn.title = 'Radio offline'; }
    else btn.title = playing ? 'Szünet' : 'Indítsd a rádiót';
  }
  function fadeTo(t, ms){
    clearInterval(fader);
    const n = Math.max(1, Math.round(ms/40)); let i = 0;
    fader = setInterval(() => { i++; widget.setVolume(Math.min(t, Math.round(t*i/n)));
      if (i >= n) clearInterval(fader); }, 40);
  }
  const EV = ['pointerdown','keydown','touchstart','wheel'];
  function go(e){
    if (e && e.target && e.target.closest && e.target.closest('.live')) return;
    widget.setVolume(0); widget.play(); fadeTo(VOLUME, 1800);
  }
  const armR = () => EV.forEach(t => addEventListener(t, go, {passive:true}));
  const disarm = () => EV.forEach(t => removeEventListener(t, go, {passive:true}));

  widget.bind(SC.Widget.Events.READY, () => {
    widget.setVolume(0); widget.play(); fadeTo(VOLUME, 2200);
    setTimeout(() => widget.isPaused(p => { if (p) armR(); }), 1000);
  });
  widget.bind(SC.Widget.Events.PLAY,  () => { playing = true; disarm(); render(); });
  widget.bind(SC.Widget.Events.PAUSE, () => { playing = false; render(); });
  widget.bind(SC.Widget.Events.FINISH,() => {
    playing = false; render();
    if (LOOP){ widget.seekTo(0); widget.play(); }
  });
  widget.bind(SC.Widget.Events.ERROR, () => { dead = true; playing = false; render(); });
  btn.addEventListener('click', () => {
    if (dead) return;
    if (playing) widget.pause();
    else { widget.setVolume(0); widget.play(); fadeTo(VOLUME, 900); }
  });
  render();
})();
</script>
</body>
</html>
